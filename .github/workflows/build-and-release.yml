name: Build and Release Plugin Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup TinyGo
        run: |
          set -euo pipefail
          curl -sL -o /tmp/tinygo.deb https://github.com/tinygo-org/tinygo/releases/download/v0.41.1/tinygo_0.41.1_amd64.deb
          sudo dpkg -i /tmp/tinygo.deb

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build backend WASM
        working-directory: backend
        run: |
          set -euo pipefail
          tinygo build -target=wasip1 -buildmode=c-shared -o backend.wasm .

      - name: Build frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Build MCP
        working-directory: mcp
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Create archives
        run: |
          set -euo pipefail
          mkdir -p release/manifest release/backend release/migrations
          cp plugin.json release/manifest/plugin.json
          cp backend/backend.wasm release/backend/backend.wasm
          cp backend/migrations/*.sql release/migrations/

          tar -czf manifest.tar.gz -C release/manifest .
          tar -czf backend.tar.gz -C release/backend .
          tar -czf migrations.tar.gz -C release/migrations .
          tar -czf frontend.tar.gz -C frontend/dist .
          tar -czf mcp.tar.gz -C mcp/dist .

      - name: Generate checksums
        run: |
          set -euo pipefail
          sha256sum manifest.tar.gz backend.tar.gz migrations.tar.gz frontend.tar.gz mcp.tar.gz > checksums.txt

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            manifest.tar.gz
            backend.tar.gz
            migrations.tar.gz
            frontend.tar.gz
            mcp.tar.gz
            checksums.txt
